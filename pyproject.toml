[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homeequity"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyspark==3.5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Legacy demo suite, deleted in Task 8; do not edit it to satisfy lint.
"tests/test_pyspark_outputs.py" = ["I001"]

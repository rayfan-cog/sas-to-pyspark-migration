name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Parity skips are hard failures in CI: a green run must mean parity was
      # actually verified against the golden SAS outputs.
      REQUIRE_GOLDEN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "pyspark==3.5.1" "pytest==8.3.3"
          fi

      - name: Unittest suite
        run: python -m unittest tests.test_pyspark_outputs -v

      - name: Pytest suite (golden outputs required)
        run: python -m pytest tests -v -ra
